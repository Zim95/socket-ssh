---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: podsnservices-cluster-role-prod
rules:
- apiGroups: [""]
  resources: ["pods", "pods/exec", "services", "services/status", "secrets"]
  verbs: ["list", "create", "delete", "get"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: podsnservices-sa-prod
  namespace: ${NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: podsnservices-cluster-role-binding-prod
subjects:
- kind: ServiceAccount
  name: podsnservices-sa-prod
  namespace: ${NAMESPACE}
roleRef:
  kind: ClusterRole
  name: podsnservices-cluster-role-prod
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: socket-ssh
  namespace: ${NAMESPACE}
  labels:
    app: socket-ssh
spec:
  selector:
    matchLabels:
      app: socket-ssh
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: socket-ssh
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      serviceAccountName: podsnservices-sa-prod
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      # See browseterm-server-local/infra/deployment/deployment.yaml's identical hostAliases
      # block: on a single-Mac two-cluster local dev setup, BROWSETERM_CLOUD_API_URL's hostname
      # resolves inside this cluster's own pods to the Mac's own /etc/hosts mapping (127.0.0.1,
      # for the developer's browser), not the real Cloud cluster - required for the ws_tokens
      # API call (P11) to work at all from inside browseterm-k3s-local.
      hostAliases:
      - ip: "${CLOUD_INGRESS_HOST_IP}"
        hostnames:
        - "${CLOUD_INGRESS_HOST}"
      containers:
      - name: socket-ssh
        image: ${REPO_NAME}/socket-ssh:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: wss
          containerPort: 8000
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        # P11: no more REDIS_* here - socket-ssh consumes one-time ws_tokens via Cloud's
        # POST /auth/websocket-tokens/consume instead of touching Cloud's Redis directly.
        - name: BROWSETERM_CLOUD_API_URL
          value: "${BROWSETERM_CLOUD_API_URL}"
        - name: ALLOWED_ORIGINS
          value: "${ALLOWED_ORIGINS_PROD}"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: socket-ssh-service
  namespace: ${NAMESPACE}
  labels:
    app: socket-ssh
spec:
  type: ClusterIP
  selector:
    app: socket-ssh
  ports:
  - name: wss
    protocol: TCP
    port: 8000
    targetPort: wss
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: socket-ssh-hpa
  namespace: ${NAMESPACE}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: socket-ssh
  # Pinned to 1 for now: this all runs on a single 4-core/8GB dev VM, and multiple replicas
  # fighting the same node for resources (rather than adding real capacity) has repeatedly
  # made contention episodes worse, not better. Raise this once running on real multi-node
  # capacity.
  minReplicas: 1
  maxReplicas: 1
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: socket-ssh-prod-pdb
  namespace: ${NAMESPACE}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: socket-ssh
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: socket-ssh-ingress
  namespace: ${NAMESPACE}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # socket-ssh sends no WS ping/pong keepalive, so nginx's default 60s proxy-read/send-timeout
    # silently drops any interactive session idle for more than a minute (looks like a random
    # disconnect to the user, not a real network issue). Raised to 1h to cover realistic idle gaps.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
  - host: ${SOCKET_SSH_HOST}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: socket-ssh-service
            port:
              number: 8000
---
# remotetunelling.md Phase 1/2: gives socket-ssh a public, outbound-dialed HTTPS/WSS endpoint so a
# browser off this LAN can still reach it, without port-forwarding the home router or exposing
# this cluster's API/MinIO/container-maker. Points at socket-ssh-service (the existing stable
# ClusterIP above) over in-cluster DNS - never a port-forward.
#
# Port 4040 (ngrok's own local inspection API - what the Checkpoint B registrar reads the current
# public URL from) is deliberately NOT given a Service: only a sidecar sharing this Pod's network
# namespace can reach it via localhost, keeping it unreachable from anywhere else in the cluster,
# let alone the internet, matching remotetunelling.md's "keep the ngrok inspection/admin API
# private" requirement.
#
# Image pinned by digest (ngrok/ngrok:3, resolved 2026-09-18) rather than a bare tag, matching
# "pinned and documented ngrok image version, not latest".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngrok-agent
  namespace: ${NAMESPACE}
  labels:
    app: ngrok-agent
spec:
  replicas: 1
  strategy:
    type: Recreate  # only one agent should ever hold this authtoken's tunnel at a time
  selector:
    matchLabels:
      app: ngrok-agent
  template:
    metadata:
      labels:
        app: ngrok-agent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: ngrok-agent
        image: ngrok/ngrok@sha256:14d80d083e5b53145f416bbbd36238336c9de4016c43fd950eb2eb845670583b
        imagePullPolicy: IfNotPresent
        args:
        - "http"
        - "socket-ssh-service.${NAMESPACE}.svc.cluster.local:8000"
        - "--log=stdout"
        env:
        - name: NGROK_AUTHTOKEN
          valueFrom:
            secretKeyRef:
              name: ngrok-credentials
              key: NGROK_AUTHTOKEN
        ports:
        - name: inspect
          containerPort: 4040
          protocol: TCP
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /api/tunnels
            port: 4040
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/tunnels
            port: 4040
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      # remotetunelling.md Phase 3 - sidecar in the SAME Pod (shares the ngrok-agent container's
      # network namespace) so it can reach ngrok's own inspection API over plain localhost:4040,
      # with nothing else in the cluster (let alone the internet) able to reach that port at all.
      - name: tunnel-registrar
        image: ${REPO_NAME}/tunnel-registrar:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: BROWSETERM_CLOUD_API_URL
          value: "${BROWSETERM_CLOUD_API_URL}"
        # DEVICE_ID/DEVICE_TOKEN come from device-credentials, synced from Desktop's own Keychain
        # by desktop/local_stack.py - deliberately NOT the shared browseterm-internal-api-token
        # Secret every other workload here uses, since the tunnel endpoints are per-device Bearer
        # auth, not the shared internal-service secret.
        - name: DEVICE_ID
          valueFrom:
            secretKeyRef:
              name: device-credentials
              key: DEVICE_ID
        - name: DEVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: device-credentials
              key: DEVICE_TOKEN
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
      terminationGracePeriodSeconds: 15
